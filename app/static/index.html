<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地数据脱敏</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#172033;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:20px;margin:0}.status{font-size:13px;color:#b8c8df}main{max-width:1180px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:white;color:#334155;border:1px solid #d8dee8}.tabs button.active{background:#2563eb;color:white;border-color:#2563eb}.view{display:none}.view.active{display:block}.panel{background:white;border:1px solid #dfe4ec;border-radius:8px;padding:18px;margin-bottom:14px}textarea{width:100%;min-height:260px;border:1px solid #cbd5e1;border-radius:6px;padding:12px;font:14px/1.6 inherit}button{border:0;border-radius:5px;padding:9px 14px;background:#2563eb;color:#fff;cursor:pointer;margin:7px 5px 0 0}button.secondary{background:#64748b}button.danger{background:#dc2626}input,select{padding:8px;border:1px solid #cbd5e1;border-radius:5px;margin:4px}pre{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:5px;min-height:70px}.entity{display:inline-flex;gap:7px;padding:6px 9px;margin:4px;background:#eef2ff;border-radius:4px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:16px}.panel{padding:14px}}
</style></head><body><header><h1>本地数据脱敏</h1><span class=status id=status>规则引擎就绪</span></header><main><nav class=tabs><button class=active data-view=textView>文本</button><button data-view=imageView>图片</button><button data-view=documentView>文档</button><button data-view=rulesView>规则</button><button data-view=tasksView>任务</button><button data-view=modelView>模型</button></nav>
<section id=textView class="view active"><div class=grid><div class=panel><h2>原文</h2><textarea id=text placeholder="输入或粘贴中文文本"></textarea><button onclick=analyzeText()>分析实体</button><button onclick=maskText()>执行脱敏</button><button class=secondary onclick=restoreText()>恢复原文</button></div><div class=panel><h2>结果</h2><pre id=output></pre></div></div><div class=panel><h2>实体复核</h2><div id=entities>先执行分析</div></div></section>
<section id=imageView class=view><div class=panel><h2>图片脱敏</h2><input type=file id=imageFile accept="image/*"><button onclick=analyzeImage()>上传并分析</button><button onclick=maskImage()>执行模糊</button><label>半径<input id=blur type=number value=14 min=1 max=80></label><pre id=imageResult></pre></div></section>
<section id=documentView class=view><div class=panel><h2>文档脱敏</h2><input type=file id=documentFile accept=".txt,.md,.docx,.pdf,.tif,.tiff"><button onclick=analyzeDocument()>上传并分析</button><button onclick=maskDocument()>执行脱敏</button><pre id=documentResult></pre></div></section>
<section id=rulesView class=view><div class=panel><h2>自定义规则</h2><input id=ruleName placeholder="名称"><select id=ruleKind><option value=word>词条</option><option value=regex>正则</option></select><input id=rulePattern placeholder="匹配内容"><input id=ruleType value=CUSTOM placeholder="实体类型"><button onclick=addRule()>添加规则</button><pre id=ruleResult></pre></div></section>
<section id=tasksView class=view><div class=panel><h2>任务历史</h2><button onclick=listTasks()>刷新</button><pre id=tasks></pre></div></section>
<section id=modelView class=view><div class=panel><h2>模型</h2><button onclick=initModel()>初始化 RaNER / OCR</button><pre id=modelResult></pre></div></section></main><script>
let ents=[],taskId='',imageId='',docId='';const q=x=>document.getElementById(x);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');q(b.dataset.view).classList.add('active')});
async function json(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.detail||'请求失败');return j}async function analyzeText(){let j=await json('/api/text/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q('text').value})});ents=j.entities;q('entities').innerHTML=ents.map((e,i)=>`<label class=entity><input type=checkbox checked data-e=${i}>${e.type}: ${e.text}</label>`).join('')||'未发现实体';q('output').textContent=JSON.stringify(ents,null,2)}async function maskText(){try{let e=ents.map((x,i)=>({...x,selected:q('textView').querySelector(`[data-e="${i}"]`)?.checked}));let j=await json('/api/text/mask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q('text').value,entities:e})});taskId=j.task_id;q('output').textContent=j.masked_text}catch(e){q('output').textContent=e.message}}async function restoreText(){if(!taskId)return;let j=await json('/api/text/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:taskId,masked_text:q('output').textContent})});q('output').textContent=j.text}async function analyzeImage(){try{let f=q('imageFile').files[0];let j=await json('/api/image/analyze',{method:'POST',body:(()=>{let d=new FormData();d.append('file',f);return d})()});imageId=j.analysis_id;q('imageResult').textContent=JSON.stringify(j,null,2)}catch(e){q('imageResult').textContent=e.message}}async function maskImage(){if(!imageId)return;let j=await json('/api/image/mask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis_id:imageId,blur_radius:+q('blur').value,boxes:[]})});q('imageResult').textContent=JSON.stringify(j,null,2)}async function analyzeDocument(){try{let f=q('documentFile').files[0],d=new FormData();d.append('file',f);let j=await json('/api/document/analyze',{method:'POST',body:d});docId=j.analysis_id;q('documentResult').textContent=j.text||JSON.stringify(j,null,2)}catch(e){q('documentResult').textContent=e.message}}async function maskDocument(){q('documentResult').textContent+='\n文档实体请在文本工作区复核后执行。'}async function addRule(){try{let j=await json('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:q('ruleName').value,kind:q('ruleKind').value,pattern:q('rulePattern').value,entity_type:q('ruleType').value})});q('ruleResult').textContent='已添加规则 '+j.id}catch(e){q('ruleResult').textContent=e.message}}async function listTasks(){let j=await json('/api/tasks');q('tasks').textContent=JSON.stringify(j.tasks,null,2)}async function initModel(){let j=await json('/api/models/initialize',{method:'POST'});q('modelResult').textContent='任务 '+j.job_id+' 已提交';setTimeout(async()=>{q('modelResult').textContent=JSON.stringify(await json('/api/models/jobs/'+j.job_id),null,2)},500)}
</script></body></html>
