[project]
name = "local-desensitization"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "presidio-analyzer>=2.2.364,<3",
  "presidio-anonymizer>=2.2.364,<3",
  "pydantic>=2.8,<3",
  "Pillow>=10,<12",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "cryptography>=48,<49",
  "modelscope>=1.18,<2",
]
[project.optional-dependencies]
ai = ["torch==2.5.1+cpu", "addict>=2.4", "transformers>=4.39,<5", "datasets>=2.16,<4.9", "einops>=0.7", "simplejson>=3.3", "sortedcontainers>=1.5", "scipy>=1.10"]
ocr = [
  "paddleocr==2.10.0",
  "paddlepaddle==3.0.0",
  "albumentations==1.4.10",
  "albucore==0.0.13",
  "numpy<2",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
