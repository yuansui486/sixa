[package]
name = "sixa"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
domain.workspace = true
recognition.workspace = true
storage.workspace = true
task-engine.workspace = true
model-manager.workspace = true
integration-protocol.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
[features]
custom-protocol = ["tauri/custom-protocol"]
[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
