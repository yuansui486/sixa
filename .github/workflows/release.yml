name: 构建并发布安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布时填写现有标签，例如 v1.0.9；仅构建时可留空"
        required: false
        default: ""
      publish:
        description: "构建成功后发布 GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS)
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: sixa-windows-x64
            artifact_path: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: macOS Intel (DMG)
            os: macos-14
            target: x86_64-apple-darwin
            bundle: app,dmg
            artifact: sixa-macos-x64
            artifact_path: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: macOS Apple Silicon (DMG)
            os: macos-14
            target: aarch64-apple-darwin
            bundle: app,dmg
            artifact: sixa-macos-arm64
            artifact_path: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.publish && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      - name: 配置 Windows 构建环境
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 配置 macOS 构建环境
        if: runner.os == 'macOS'
        shell: bash
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci --prefix ui

      - name: 核对发布版本与标签
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.publish && inputs.tag) || '' }}
        run: node tools/release/check-version.mjs

      - name: 更新协议与签名回归（离线）
        run: node --test tools/release/manifest.test.mjs

      - name: 桌面更新、保存与 MCP 回归（离线）
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo test --locked -p sixa -p storage -p integration-protocol -p sixa-mcp --target ${{ matrix.target }}

      - name: 界面单元测试
        if: runner.os == 'Windows'
        run: npm --prefix ui test

      - name: 构建 Windows MCP sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p sixa-mcp --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/sixa-mcp.exe" -Destination "src-tauri/binaries/sixa-mcp-${{ matrix.target }}.exe" -Force

      - name: 构建并测试 macOS MCP sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p integration-protocol -p sixa-mcp --target ${{ matrix.target }}
          cargo build --release --locked -p sixa-mcp --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/sixa-mcp" "src-tauri/binaries/sixa-mcp-${{ matrix.target }}"
          chmod 755 "src-tauri/binaries/sixa-mcp-${{ matrix.target }}"

      - name: 准备 macOS ONNX Runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2.tgz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz"
          echo "49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809  $archive" | shasum -a 256 --check
          mkdir -p src-tauri/runtime
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cp -L \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.dylib" \
            src-tauri/runtime/libonnxruntime.dylib
          cp \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/LICENSE" \
            src-tauri/runtime/ONNXRuntime-LICENSE.txt
          cp \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/ThirdPartyNotices.txt" \
            src-tauri/runtime/ONNXRuntime-ThirdPartyNotices.txt
          codesign --force --sign - --timestamp=none src-tauri/runtime/libonnxruntime.dylib
          codesign --verify --strict --verbose=4 src-tauri/runtime/libonnxruntime.dylib

      - name: 验证 macOS 桌面 MCP 与自动启动（离线）
        if: runner.os == 'macOS'
        timeout-minutes: 30
        shell: bash
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: |
          set -euo pipefail
          cargo build --locked -p sixa -p sixa-mcp --target ${{ matrix.target }}
          node scripts/mcp-smoke.mjs --desktop "target/${{ matrix.target }}/debug/sixa" "target/${{ matrix.target }}/debug/sixa-mcp"
          node scripts/mcp-smoke.mjs --launch "target/${{ matrix.target }}/debug/sixa-mcp"

      - name: 构建安装程序
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --prefix ui tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: 验证 Windows 安装器进程清理
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & src-tauri/installer/tests/run.ps1 `
            -McpExecutable "target/${{ matrix.target }}/release/sixa-mcp.exe" `
            -MakeNsis "$env:LOCALAPPDATA\tauri\NSIS\makensis.exe" `
            -TauriNsisDirectory "target/${{ matrix.target }}/release/nsis/x64"

      - name: 验证 macOS 安装包和应用签名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

          mount_point="$RUNNER_TEMP/sixa-${{ matrix.target }}"
          mkdir -p "$mount_point"
          printf 'Y\n' | hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT

          app="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"

          codesign --display --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=4 "$app"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) exit 1 ;;
          esac
          lipo -archs "$executable" | tr ' ' '\n' | grep -Fx "$expected_arch"

          mcp="$app/Contents/MacOS/sixa-mcp"
          test -x "$mcp"
          lipo -archs "$mcp" | tr ' ' '\n' | grep -Fx "$expected_arch"
          codesign --verify --strict --verbose=4 "$mcp"
          node scripts/mcp-smoke.mjs --metadata "$mcp"

          runtime="$app/Contents/Resources/libonnxruntime.dylib"
          test -f "$runtime"
          file "$runtime"
          codesign --verify --strict --verbose=4 "$runtime"

          # Exercise the actual packaged runtime with a tiny generated graph.
          # No production weights, model downloads or OSS traffic are involved.
          echo "SIXA_BUNDLED_RUNTIME=$runtime" >> "$GITHUB_ENV"
          # Keep this mount for the following bounded inference check.
          trap - EXIT
          echo "SIXA_DMG_MOUNT=$mount_point" >> "$GITHUB_ENV"

      - name: 验证 macOS 更新包与 DMG 内容一致
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -n "$archive" && test -s "$archive.sig"
          unpacked="$RUNNER_TEMP/sixa-update-${{ matrix.target }}"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          app="$(find "$unpacked" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_app="$(find "$SIXA_DMG_MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" && test -n "$dmg_app"
          codesign --verify --deep --strict --verbose=4 "$app"
          cmp "$app/Contents/MacOS/sixa" "$dmg_app/Contents/MacOS/sixa"
          cmp "$app/Contents/MacOS/sixa-mcp" "$dmg_app/Contents/MacOS/sixa-mcp"
          cmp "$app/Contents/Resources/libonnxruntime.dylib" "$dmg_app/Contents/Resources/libonnxruntime.dylib"

      - name: 验证 macOS 实际推理（离线微型模型）
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          trap 'hdiutil detach "$SIXA_DMG_MOUNT"' EXIT
          cargo run --release --locked -p recognition --example runtime_probe \
            --target ${{ matrix.target }} -- "$SIXA_BUNDLED_RUNTIME"

      - name: 保存安装程序
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release 与 OSS 更新
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    concurrency:
      group: sixa-stable-oss
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.publish && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix tools/release
      - name: 下载全部安装程序
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: false

      - name: 核对发布凭据
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          test -n "$OSS_ACCESS_KEY_ID" && test -n "$OSS_ACCESS_KEY_SECRET" || { echo "请先配置 OSS 发布凭据"; exit 1; }

      - name: 校验签名并生成三平台更新清单
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          node tools/release/check-version.mjs
          export RELEASE_DATE="$(git log -1 --format=%cI)"
          node tools/release/manifest.mjs release-assets release-ready "${RELEASE_TAG#v}"

      - name: 发布不可覆盖的 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/sixa-release-check"
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/sixa-release-check"
            cmp release-ready/SHA256SUMS.txt "$RUNNER_TEMP/sixa-release-check/SHA256SUMS.txt"
          else
            gh release create "$RELEASE_TAG" release-ready/* \
              --title "私匣 $RELEASE_TAG" \
              --notes-file "docs/releases/${RELEASE_TAG#v}.md" --latest
          fi

      - name: 上传 OSS 并最后更新稳定版本清单
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node tools/release/publish.mjs release-ready
