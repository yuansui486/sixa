name: 构建并发布安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的现有标签，例如 v1.0.4"
        required: true
        default: "v1.0.4"
      publish:
        description: "构建成功后发布 GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (NSIS)
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: sixa-windows-x64
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS Intel (DMG)
            os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: sixa-macos-x64
            artifact_path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Apple Silicon (DMG)
            os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: sixa-macos-arm64
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: 配置 Windows 构建环境
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 配置 macOS 构建环境
        if: runner.os == 'macOS'
        shell: bash
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci --prefix ui

      - name: 构建 Windows MCP sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p sixa-mcp --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath "target/${{ matrix.target }}/release/sixa-mcp.exe" -Destination "src-tauri/binaries/sixa-mcp-${{ matrix.target }}.exe" -Force

      - name: 准备 macOS ONNX Runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2.tgz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz"
          echo "49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809  $archive" | shasum -a 256 --check
          mkdir -p src-tauri/runtime
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cp -L \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.dylib" \
            src-tauri/runtime/libonnxruntime.dylib
          cp \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/LICENSE" \
            src-tauri/runtime/ONNXRuntime-LICENSE.txt
          cp \
            "$RUNNER_TEMP/onnxruntime-osx-universal2-1.23.2/ThirdPartyNotices.txt" \
            src-tauri/runtime/ONNXRuntime-ThirdPartyNotices.txt
          codesign --force --sign - --timestamp=none src-tauri/runtime/libonnxruntime.dylib
          codesign --verify --strict --verbose=4 src-tauri/runtime/libonnxruntime.dylib

      - name: 验证正式模型下载、续传、安装和推理
        env:
          SIXA_TEST_ONNX_RUNTIME: ${{ github.workspace }}/src-tauri/runtime/libonnxruntime.dylib
        run: cargo run --locked -p model-manager --example remote_acceptance

      - name: 构建安装程序
        run: npx --prefix ui tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: 验证 macOS 安装包和应用签名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

          mount_point="$RUNNER_TEMP/sixa-${{ matrix.target }}"
          mkdir -p "$mount_point"
          printf 'Y\n' | hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT

          app="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          test -x "$executable"

          codesign --display --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=4 "$app"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) expected_arch="arm64" ;;
            x86_64-apple-darwin) expected_arch="x86_64" ;;
            *) exit 1 ;;
          esac
          lipo -archs "$executable" | tr ' ' '\n' | grep -Fx "$expected_arch"

          runtime="$app/Contents/Resources/libonnxruntime.dylib"
          test -f "$runtime"
          file "$runtime"
          codesign --verify --strict --verbose=4 "$runtime"

      - name: 保存安装程序
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载全部安装程序
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          windows_installer="$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          macos_arm64="$(find release-assets -maxdepth 1 -type f -name '*aarch64.dmg' -print -quit)"
          macos_x64="$(find release-assets -maxdepth 1 -type f -name '*x64.dmg' -print -quit)"
          test -n "$windows_installer" && test -n "$macos_arm64" && test -n "$macos_x64"
          mv "$windows_installer" "release-assets/Sixa_${version}_windows_x64_setup.exe"
          mv "$macos_arm64" "release-assets/Sixa_${version}_macos_arm64.dmg"
          mv "$macos_x64" "release-assets/Sixa_${version}_macos_x64.dmg"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          私匣是本机数据脱敏桌面应用。本次 Release 提供：

          - Windows 10/11 x64 NSIS 安装程序
          - macOS 11+ Intel DMG 安装程序
          - macOS 11+ Apple Silicon DMG 安装程序

          模型优先通过阿里云 OSS 北京公网地址下载，失败时自动切换到 ModelScope 备用源。两个来源共享断点，下载界面会显示当前来源、切换状态、百分比、已下载大小、实时速度和预计剩余时间。

          macOS 登录状态和设备标识使用应用主密钥加密保存，避免登录校验和心跳反复弹出钥匙串授权。首次从旧版本升级时，应用会尝试一次性迁移旧凭据。

          macOS 应用已进行完整性签名，但尚未使用 Apple Developer ID 签名和公证。首次打开时可能需要在“系统设置 → 隐私与安全性”中确认。macOS 安装包内含 ONNX Runtime 1.23.2 universal2 运行库。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.dmg|SHA256SUMS.txt) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
              esac
            done
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "私匣 $RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          fi
